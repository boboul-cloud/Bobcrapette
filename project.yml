name: Bobcrapette
options:
  bundleIdPrefix: com.oulhen
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 38DQ8FW23J
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Bobcrapette:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: Bobcrapette
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oulhen.bobcrapette
        PRODUCT_NAME: Bobcrapette
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Bobcrapette
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        # L'iPad n'exige pas le plein écran, il doit donc accepter les quatre
        # orientations ; l'iPhone garde les trois habituelles.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Robert Oulhen. Tous droits réservés."
        # L'application n'utilise aucun chiffrement : évite la déclaration de
        # conformité à l'exportation à chaque envoi sur App Store Connect.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.card-games"
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

  BobcrapetteTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: BobcrapetteTests
    dependencies:
      - target: Bobcrapette
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oulhen.bobcrapette.tests
        GENERATE_INFOPLIST_FILE: YES
        # L'exécutable hôte ne se trouve pas au même endroit selon la plateforme.
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Bobcrapette.app/Contents/MacOS/Bobcrapette"
        "TEST_HOST[sdk=iphoneos*]": "$(BUILT_PRODUCTS_DIR)/Bobcrapette.app/Bobcrapette"
        "TEST_HOST[sdk=iphonesimulator*]": "$(BUILT_PRODUCTS_DIR)/Bobcrapette.app/Bobcrapette"
        BUNDLE_LOADER: "$(TEST_HOST)"

  BobcrapetteUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    deploymentTarget:
      iOS: "17.0"
    sources:
      - path: BobcrapetteUITests
    dependencies:
      - target: Bobcrapette
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oulhen.bobcrapette.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Bobcrapette

schemes:
  Bobcrapette:
    build:
      targets:
        Bobcrapette: all
        BobcrapetteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BobcrapetteTests

  BobcrapetteUI:
    build:
      targets:
        Bobcrapette: all
        BobcrapetteUITests: [test]
    test:
      config: Debug
      targets:
        - BobcrapetteUITests
